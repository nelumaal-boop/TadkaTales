<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <!-- Flame / Aroma Gold Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Kadai / Pan Metallic Gradient -->
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="drop-shadow(0 6px 12px rgba(194, 65, 12, 0.35))"/>

  <!-- Inner Subtle Ring -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>

  <!-- Aromatic Steam & Flame Swirls -->
  <!-- Left Steam Wave -->
  <path d="M 46 44 C 42 36, 48 30, 44 22" fill="none" stroke="url(#flameGrad)" stroke-width="3" stroke-linecap="round" opacity="0.95" filter="url(#softGlow)"/>
  <!-- Center Main Flame / Steam -->
  <path d="M 60 48 C 66 38, 54 30, 60 18" fill="none" stroke="url(#flameGrad)" stroke-width="3.5" stroke-linecap="round" opacity="1" filter="url(#softGlow)"/>
  <!-- Right Steam Wave -->
  <path d="M 74 44 C 78 36, 72 30, 76 22" fill="none" stroke="url(#flameGrad)" stroke-width="3" stroke-linecap="round" opacity="0.95" filter="url(#softGlow)"/>

  <!-- Sparkles / Spice Seeds Popping -->
  <circle cx="50" cy="27" r="1.5" fill="#FEF08A"/>
  <circle cx="69" cy="24" r="1.8" fill="#FEF08A"/>
  <circle cx="58" cy="32" r="1.2" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="1.5" fill="#FDE68A"/>

  <!-- Tadka Pan / Kadai Body -->
  <!-- Deep Bowl -->
  <path d="M 32 58 C 32 79, 44 87, 60 87 C 76 87, 88 79, 88 58 Z" fill="url(#panGrad)"/>
  
  <!-- Pan Rim -->
  <ellipse cx="60" cy="58" rx="28" ry="6.5" fill="#EA580C" opacity="0.25"/>
  <ellipse cx="60" cy="58" rx="28" ry="6.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Traditional Loop Handles -->
  <!-- Left Handle -->
  <path d="M 32 58 C 22 56, 22 66, 33 65" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Handle -->
  <path d="M 88 58 C 98 56, 98 66, 87 65" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing Sizzling Tadka Oil in Bowl -->
  <ellipse cx="60" cy="62" rx="19" ry="4" fill="url(#flameGrad)" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Mustard / Cumin Seeds in Oil -->
  <circle cx="54" cy="62" r="1" fill="#78350F"/>
  <circle cx="58" cy="61" r="1.2" fill="#78350F"/>
  <circle cx="63" cy="63" r="1" fill="#78350F"/>
  <circle cx="67" cy="61.5" r="1.1" fill="#78350F"/>
  <circle cx="60" cy="63.5" r="0.9" fill="#78350F"/>

  <!-- Base Heat Radiance Accent Curve -->
  <path d="M 44 95 Q 60 100 76 95" fill="none" stroke="rgba(254, 240, 138, 0.6)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
